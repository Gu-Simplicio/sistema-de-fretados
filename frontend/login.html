<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chega Quando?</title>
    <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>
    <div class="caixa">
        <div class="logo-bus" aria-label="Logo do transporte">
                <img src="assets/img/onibus.png" width="90%" height="100%" alt="Logo do transporte">
        </div>

        <h1>Chega Quando?</h1>
        <p class="subtitulo">Transporte fretado inteligente</p>

        <select id="selectPerfil" class="perfil-selecao perfil ativo" style="text-align: center;">
            <option value="estudante">ESTUDANTE</option>
            <option value="empresa">EMPRESA</option>
            <option value="motorista">MOTORISTA</option>
        </select>

        <form id="formLogin" novalidate>
            <div class="campo">
                <label for="Usuario">Usuário</label>
                <input type="text" id="Usuario" name="Usuario" required autocomplete="username">
            </div>

            <div class="campo">
                <label for="Senha">Senha</label>
                <input type="password" id="Senha" name="Senha" required autocomplete="current-password">
            </div>

            <button type="submit" class="botao-entrar">ENTRAR</button>
        </form>

        <p class="cadastro">
            Não possui uma conta? <a href="cadastro.html">Cadastre-se aqui</a>
        </p>
    </div>

    <script src="assets/js/modal.js"></script>
    <script src="assets/js/login.js"></script>
    <script>
        document.querySelector("#formLogin").addEventListener("submit", function (event) {
            event.preventDefault();
            logar();
        });
    </script>
</body>
