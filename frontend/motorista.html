<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Motorista | Chega Quando?</title>
    <link rel="stylesheet" href="assets/css/motorista.css">
</head>
<body>
    <header class="nav">
        <div class="nav-title">
            <p class="nome-sistema">Chega Quando?</p>
            <h1>Painel do Motorista</h1>
        </div>
        <button type="button" class="Sair" id="sair" aria-label="Sair" disabled>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <path d="m16 17 5-5-5-5M21 12H9"/>
            </svg>
        </button>
    </header>

    <main class="container">
        <section class="grid-metrics" aria-label="Resumo da rota atual">
            <div class="card">
                <span class="icon-box card-blue" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 2"/>
                    </svg>
                </span>
                <dl class="info-metric">
                    <dt>Saída prevista</dt>
                    <dd><time datetime="07:00">07:00</time></dd>
                </dl>
            </div>

            <div class="card">
                <span class="icon-box card-green" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="8" r="3.5"/>
                        <path d="M2 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 4.7a3.5 3.5 0 0 1 0 6.6M21.5 20v-2a4 4 0 0 0-3-3.9"/>
                    </svg>
                </span>
                <dl class="info-metric">
                    <dt>Alunos previstos</dt>
                    <dd>5</dd>
                </dl>
            </div>

            <div class="card">
                <span class="icon-box card-purple" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                        <circle cx="12" cy="10" r="2.5"/>
                    </svg>
                </span>
                <dl class="info-metric">
                    <dt>Paradas na rota</dt>
                    <dd>4</dd>
                </dl>
            </div>

            <div class="card">
                <span class="icon-box card-orange" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 21V4c5-4 9 4 15 0v10c-6 4-10-4-15 0"/>
                    </svg>
                </span>
                <dl class="info-metric">
                    <dt>Chegada prevista</dt>
                    <dd><time datetime="07:45">07:45</time></dd>
                </dl>
            </div>
        </section>

        <section class="grid-actions" aria-label="Menu do motorista">
            <button type="button" id="rota-atual" class="card card-action" disabled>
                <span class="icon-box card-blue" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="5" cy="18" r="2.5"/>
                        <circle cx="19" cy="6" r="2.5"/>
                        <path d="M7.5 18H16a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8.5"/>
                    </svg>
                </span>
                <span class="info">
                    <strong>Rota atual</strong>
                    <span>Centro – Campus Principal</span>
                </span>
            </button>

            <button type="button" id="chamada" class="card card-action" disabled>
                <span class="icon-box card-green" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="8" y="3" width="8" height="4" rx="1.5"/>
                        <path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M8.5 13.5l2.5 2.5 4.5-5"/>
                    </svg>
                </span>
                <span class="info">
                    <strong>Chamada</strong>
                    <span>Conferir quais alunos embarcaram</span>
                </span>
            </button>

            <button type="button" id="chat-motoristas" class="card card-action" disabled>
                <span class="icon-box card-purple" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 10.5a2 2 0 0 1-2 2H8L3 16V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2z"/>
                        <path d="M8 16v.5a2 2 0 0 0 2 2h6l5 3v-11a2 2 0 0 0-2-2"/>
                    </svg>
                </span>
                <span class="info">
                    <strong>Chat com motoristas</strong>
                    <span>Trocar informações com outros motoristas</span>
                </span>
            </button>

            <button type="button" id="chat-rota-atual" class="card card-action" disabled>
                <span class="icon-box card-orange" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 14a3 3 0 0 1-3 3H9l-6 4V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3z"/>
                        <path d="M7 8h10M7 12h6"/>
                    </svg>
                </span>
                <span class="info">
                    <strong>Chat da rota atual</strong>
                    <span>Conversar com os alunos desta viagem</span>
                </span>
            </button>

            <button type="button" id="ticket-emergencia" class="card card-action" disabled>
                <span class="icon-box card-red" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m10.3 4-8 14a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0Z"/>
                        <path d="M12 9v4m0 4h.01"/>
                    </svg>
                </span>
                <span class="info">
                    <strong>Ticket de emergência</strong>
                    <span>Comunicar uma emergência à empresa</span>
                </span>
            </button>
        </section>
    </main>
</body>
</html>
