<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/default.css">
    <link rel="stylesheet" href="assets/css/demandas.css">
    <title> Indicadores de Demanda </title>
</head>
<body>
    <main class="container">
        <div class="campo-longo">
            <h2>Ocupação por Rota</h2>

            <div class="ocupacao">
                <div class="dadosOcupacao"> 
                    <h2>Centro - Campus Principal</h2>

                    <span>92%</span>    
                </div>
                
                <div class="barraOcupacao">
                    <div class="cheio" style="width: 92%;"></div>
                </div>

                <p> Capacidade: 15 passageiros </p>
            </div>

            <div class="ocupacao">
                <div class="dadosOcupacao"> 
                    <h2>Bairro Norte - Campus Tecnológico</h2>

                    <span>88%</span>    
                </div>
                
                <div class="barraOcupacao">
                    <div class="quaseCheio" style="width: 88%;"></div>
                </div>

                <p> Capacidade: 12 passageiros </p>
            </div>

            <div class="ocupacao">
                <div class="dadosOcupacao"> 
                    <h2>Shopping Sul - Campus Principal</h2>

                    <span>75%</span>    
                </div>
                
                <div class="barraOcupacao">
                    <div class="quaseCheio" style="width: 75%;"></div>
                </div>

                <p> Capacidade: 20 passageiros </p>
            </div>
            
            <div class="ocupacao">
                <div class="dadosOcupacao"> 
                    <h2>Terminal Oeste - Campus Medicina</h2>

                    <span>100%</span>    
                </div>
                
                <div class="barraOcupacao">
                    <div class="cheio" style="width: 100%;"></div>
                </div>

                <p> Capacidade: 10 passageiros </p>
            </div>
        </div>
    </main>
</body>
</html>
