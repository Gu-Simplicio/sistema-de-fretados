<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/estilo.css">
    <title>Cadastro de Motoristas</title>
</head>
<body>
    
    <main class="caixa cadastro-motorista">

        <a href="#" class="voltar">
            Voltar
        </a>

        <header class="cabecalho-cadastro">
            <h1>Cadastrar Motorista</h1>
            <p class="subtitulo">Adicione um novo motorista à sua empresa.</p>
        </header>

        <form class="form-motorista" autocomplete="off">


            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Nome completo" autocomplete="off" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="CPF" autocomplete="off" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(99)99999-9999" autocomplete="off" required
                pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
            </div>

            <div class="campo">
                <label for="cnh">Número da CNH</label>
                <input type="text" id="cnh" name="cnh" inputmode="numeric" autocomplete="off" required
                pattern="[0-9]{11}"
                maxlength="11">
            </div>

            <div class="campo">
                <label for="validade">Validade da CNH</label>
                <input type="date" id="validade" name="validade" required>
            </div>

            <button type="submit" class="botao-entrar">
                CADASTRAR MOTORISTA
            </button>

        </form>












    </main>



<script src="./assets/js/cadastromotorista.js"></script>

</body>
</html>
