<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <button href="index.html"><img src="d.png" alt="Voltar" style="width: 30px; height: 30px; background: none;"></button>
    <div class="caixa">

        <h1>Cadastro</h1>
        <p class="subtitulo">Crie sua conta</p>

        <div class="perfil-selecao" aria-label="Seleção de perfil">
            <button type="button" class="perfil ativo">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.588 0-6.5 2.239-6.5 5.25A1.75 1.75 0 0 0 7.25 21h9.5A1.75 1.75 0 0 0 18.5 19.25C18.5 16.239 15.588 14 12 14z"/></svg>
                </span>
                <span>ESTUDANTE</span>
            </button>
            <button type="button" class="perfil">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 20V7.5A1.5 1.5 0 0 1 6.5 6H9V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6h2.5A1.5 1.5 0 0 1 19 7.5V20H5zm2-8h10v2H7zm0-4h10v2H7zm2-4h6v1H9z"/></svg>
                </span>
                <span>EMPRESA</span>
            </button>
        </div>

        <div class="campo">
            <label for="Usuario">Usuario</label>
            <input type="text" id="Usuario" name="Usuario">
        </div>

        <div class="campo">
            <label for="Senha">Senha</label>
            <input type="password" id="Senha" name="Senha">
        </div>

        <button type="button" class="botao-entrar" onclick="criarConta()">Criar</button>

    </div>
    <link rel="stylesheet" href="estilo.css">
</body>
</html>
